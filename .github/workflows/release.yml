name: Release (npm)

# npm 채널 배포 — N0097 v0.8 cut. 비가역(이름·버전 영구 점유)이라 tag push가 아닌
# workflow_dispatch 전용 + confirm 입력으로만 실제 publish. confirm != PUBLISH면 build +
# assemble + `npm publish --dry-run`까지만 (게시 없음).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version — Cargo.toml [workspace.package] version와 일치해야 함 (예: 0.8.0)"
        required: true
        type: string
      confirm:
        description: "실제 npm 게시는 정확히 PUBLISH 입력 시에만. 그 외 값 = build + dry-run만."
        required: true
        default: "DRYRUN"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.os }}-${{ matrix.cpu }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,  cpu: x64,   triple: x86_64-unknown-linux-gnu,  runner: ubuntu-22.04 }
          - { os: linux,  cpu: arm64, triple: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          # darwin-x64는 Apple Silicon(macos-14)에서 x86_64-apple-darwin 크로스 빌드 —
          # Intel(macos-13) 러너는 희소/단계적 폐지로 큐에 무한정 묶임. clang -arch x86_64로
          # bundled sqlite C 포함 정상 빌드(런타임 테스트는 생략, 릴리스 아티팩트 목적).
          - { os: darwin, cpu: x64,   triple: x86_64-apple-darwin,       runner: macos-14 }
          - { os: darwin, cpu: arm64, triple: aarch64-apple-darwin,      runner: macos-14 }
          - { os: win32,  cpu: x64,   triple: x86_64-pc-windows-msvc,    runner: windows-latest }
          - { os: win32,  cpu: arm64, triple: aarch64-pc-windows-msvc,   runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - name: Build release binary
        # web/dist 는 커밋된 빌드 아티팩트라 Node 선행 빌드 불필요. bundled sqlite는 네이티브
        # 러너의 C 툴체인으로 컴파일된다 (arch별 네이티브 러너라 크로스 sysroot 문제 없음).
        run: cargo build --release --target ${{ matrix.triple }} -p eln-cli
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p staged
          if [ "${{ matrix.os }}" = "win32" ]; then
            cp "target/${{ matrix.triple }}/release/elf.exe" staged/
          else
            cp "target/${{ matrix.triple }}/release/elf" staged/
          fi
      - name: Smoke / arch check
        # 비가역 publish 전 깨진 크로스/네이티브 빌드를 잡는다.
        shell: bash
        run: |
          set -euo pipefail
          BIN="staged/$([ "${{ matrix.os }}" = "win32" ] && echo elf.exe || echo elf)"
          if [ "${{ matrix.os }}-${{ matrix.cpu }}" = "darwin-x64" ]; then
            # arm64 러너에서 x86_64 크로스 빌드 → 네이티브 실행 불가. arch만 검증.
            file "$BIN"
            file "$BIN" | grep -qi "x86_64" || { echo "::error::darwin-x64 arch mismatch"; exit 1; }
          else
            # 나머지 5종은 네이티브 러너 → 직접 실행 스모크.
            chmod +x "$BIN" 2>/dev/null || true
            "$BIN" --version
          fi
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}-${{ matrix.cpu }}
          path: staged/
          if-no-files-found: error

  publish:
    name: assemble + publish (npm)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Assert version matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=$(node -e "const fs=require('fs');const t=fs.readFileSync('Cargo.toml','utf8');console.log(t.match(/\[workspace\.package\][\s\S]*?version\s*=\s*\"([^\"]+)\"/)[1])")
          if [ "$EXPECTED" != "${{ inputs.version }}" ]; then
            echo "::error::dispatch version '${{ inputs.version }}' != Cargo.toml version '$EXPECTED'"
            exit 1
          fi
          node npm/scripts/sync-version.mjs --check
          echo "VERSION=$EXPECTED" >> "$GITHUB_ENV"
      - name: Assemble bundle (6 binaries → single package)
        shell: bash
        run: node npm/scripts/assemble-bundle.mjs artifacts
      - name: Verify bundle (6 binaries present + in tarball)
        # 비가역 publish 직전 마지막 가드 — 빈/부분 번들이 영구 게시되는 것 차단.
        shell: bash
        run: |
          set -euo pipefail
          N=$(find npm/elendirna/binaries -type f \( -name elf -o -name elf.exe \) | wc -l | tr -d ' ')
          if [ "$N" != "6" ]; then echo "::error::bundle has $N/6 binaries — refusing to publish"; exit 1; fi
          PACKED=$( (cd npm/elendirna && npm pack --dry-run --json) | node -e "const a=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(a[0].files.map(x=>x.path).filter(p=>/^binaries\/.+\/elf(\.exe)?$/.test(p)).length)")
          if [ "$PACKED" != "6" ]; then echo "::error::tarball lists $PACKED/6 binaries — files glob broken"; exit 1; fi
          echo "bundle OK: 6 binaries on disk + 6 in tarball"
      - name: Publish (elendirna) + deprecate prerelease shards
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" = "PUBLISH" ]; then
            if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
              echo "::error::confirm=PUBLISH 인데 NPM_TOKEN 시크릿이 없음. repo Settings → Secrets → Actions에 NPM_TOKEN 추가 필요."
              exit 1
            fi
            DRY=""
            echo "::warning::실제 npm 게시 진행 — 비가역(이름·버전 영구 점유)."
          else
            DRY="--dry-run"
            echo "::notice::confirm != PUBLISH → dry-run only (게시 없음)."
          fi

          # 멱등 게시: 이미 올라간 버전은 skip(재실행 안전) + 일시 실패 시 재시도.
          # (단일 패키지 매커니즘이라 다중 유사 이름 급속 생성이 없어 스팸 탐지 표면이 사라짐.)
          publish_one() {
            local dir="$1" name attempt
            name="$(node -p "require('./$dir/package.json').name")"
            if [ -z "$DRY" ] && npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "skip $name@$VERSION (이미 게시됨)"; return 0
            fi
            for attempt in 1 2 3; do
              if ( cd "$dir" && npm publish --access public $DRY ); then
                [ -z "$DRY" ] && sleep 15 || true
                return 0
              fi
              echo "::warning::$name 게시 attempt $attempt 실패 — 30s 후 재시도."
              sleep 30
            done
            echo "::error::$name 게시가 재시도 후에도 실패."
            return 1
          }

          # 단일 패키지 (전 바이너리 동봉). `eln` unscoped 이름은 npm name-similarity로 사용 불가 →
          # elendirna 단독 게시(eln 명령은 향후 elendirna bin alias로 재고). (N0097 r0020)
          publish_one npm/elendirna

          # 구 split 설계에서 먼저 게시됐던 플랫폼 shard 5종을 deprecate(있으면). 비가역 아님(되돌림 가능).
          if [ -z "$DRY" ]; then
            for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
              if npm deprecate "elendirna-cli-$p@$VERSION" \
                   "unused prerelease distribution shard — install 'elendirna' (binaries are bundled)" 2>/dev/null; then
                echo "deprecated elendirna-cli-$p@$VERSION"
              else
                echo "skip deprecate elendirna-cli-$p (미게시 또는 권한 없음)"
              fi
            done
          fi
