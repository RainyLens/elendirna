[workspace]
resolver = "2"
members = ["eln-core", "eln-cli"]

[workspace.package]
version = "0.7.0-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/elen-labs/elendirna"

[workspace.dependencies]
clap        = { version = "4", features = ["derive"] }
toml        = "0.8"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
anyhow      = "1"
chrono      = { version = "0.4", features = ["serde"] }
walkdir     = "2"
regex       = "1"
rmcp        = { version = "1.5", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
tokio       = { version = "1", features = ["full"] }
axum        = "0.8"
tower       = "0.5"
http        = "1"
schemars    = "1"
rusqlite    = { version = "0.39", features = ["bundled"] }
uuid        = { version = "1", features = ["v4"] }
pulldown-cmark = { version = "0.10", default-features = false }
bitflags    = "2"
async-trait = "0.1"

insta       = { version = "1", features = ["toml"] }
tempfile    = "3"
assert_cmd  = "2"
