[workspace]
resolver = "2"
members = ["eln-core", "eln-cli"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/elen-labs/elendirna"

# release 바이너리 축소 (npm 단일 패키지 동봉 페이로드 — 6 바이너리 전부 동봉) — N0097 v0.8 cut.
# panic은 기본 unwind 유지 (rmcp/tokio·테스트 호환).
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[workspace.dependencies]
clap        = { version = "4", features = ["derive"] }
toml        = "0.8"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
anyhow      = "1"
chrono      = { version = "0.4", features = ["serde"] }
walkdir     = "2"
regex       = "1"
rmcp        = { version = "1.5", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
tokio       = { version = "1", features = ["full"] }
axum        = "0.8"
tower       = "0.5"
http        = "1"
schemars    = "1"
rusqlite    = { version = "0.39", features = ["bundled"] }
uuid        = { version = "1", features = ["v4"] }
pulldown-cmark = { version = "0.10", default-features = false }
rust-embed  = { version = "8", features = ["mime-guess"] }
bitflags    = "2"
async-trait = "0.1"
sha2        = "0.10"
rand        = "0.10"

insta       = { version = "1", features = ["toml"] }
tempfile    = "3"
assert_cmd  = "2"
