[package]
name = "eln-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "elendirna core — vault domain + MCP transport runtime"

[lib]
name = "eln_core"
path = "src/lib.rs"

[dependencies]
clap            = { workspace = true }
toml            = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
thiserror       = { workspace = true }
anyhow          = { workspace = true }
chrono          = { workspace = true }
walkdir         = { workspace = true }
regex           = { workspace = true }
rmcp            = { workspace = true }
tokio           = { workspace = true }
axum            = { workspace = true }
tower           = { workspace = true }
http            = { workspace = true }
schemars        = { workspace = true }
rusqlite        = { workspace = true }
uuid            = { workspace = true }
pulldown-cmark  = { workspace = true, features = ["html"] }
rust-embed      = { workspace = true }
# eln-plugin-sdk: crates.io registry only (별 repo — CI/로컬 일관 resolve).
# 로컬 SDK 수정 즉시반영이 필요하면 임시로 path를 다시 붙이거나 재publish.
eln-plugin-sdk  = "0.1.0"
async-trait     = "0.1"
sha2            = { workspace = true }
rand            = { workspace = true }

[dev-dependencies]
insta       = { workspace = true }
tempfile    = { workspace = true }
assert_cmd  = { workspace = true }
