[package]
name = "eln-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "elendirna core — vault domain + MCP transport runtime"

[lib]
name = "eln_core"
path = "src/lib.rs"

[dependencies]
clap            = { workspace = true }
toml            = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
thiserror       = { workspace = true }
anyhow          = { workspace = true }
chrono          = { workspace = true }
walkdir         = { workspace = true }
regex           = { workspace = true }
rmcp            = { workspace = true }
tokio           = { workspace = true }
axum            = { workspace = true }
tower           = { workspace = true }
http            = { workspace = true }
schemars        = { workspace = true }
rusqlite        = { workspace = true }
uuid            = { workspace = true }
pulldown-cmark  = { workspace = true, features = ["html"] }
rust-embed      = { workspace = true }
# eln-plugin-sdk: crates.io version + 로컬 path 병행. registry resolve 가능 +
# workbench 로컬 빌드 유지 (N0097 High 1 — publish 단계 dep 전환 완료).
eln-plugin-sdk  = { version = "0.1.0", path = "../../eln-plugins" }
async-trait     = "0.1"

[dev-dependencies]
insta       = { workspace = true }
tempfile    = { workspace = true }
assert_cmd  = { workspace = true }
